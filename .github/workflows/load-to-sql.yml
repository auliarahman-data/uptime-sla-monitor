name: load-to-sql

on:
  schedule:
    # Once a day at 22:31 UTC (06:31 WITA / 05:31 WIB), after the 22:07 probe.
    # One load per day keeps the serverless database inside the free allowance.
    - cron: "31 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: load-to-sql
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load into Azure SQL
        env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_DATABASE: ${{ secrets.SQL_DATABASE }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: python load_to_sql.py
